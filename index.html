<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* base reset (matches the artifact host skeleton) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ScoreHammer Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone frame with a pinned footer; info at the top (glance zone), frequent controls at the bottom (thumb zone). Spectator renders wide. */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#1B1B1A; --muted:#5C5C58; --line:#1B1B1A; --soft:#D6D5D0; --fill:#E4E3DE;
  --accent:#1F4FD1; --accent-soft:#E9EEFC; --on-ink:#FFFFFF; --scrim:rgba(20,20,20,.5); --danger:#A3261B;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161615; --surface:#212120; --ink:#ECECE8; --muted:#A3A39D; --line:#ECECE8; --soft:#3A3A37; --fill:#2C2C2A;
  --accent:#8EA8F5; --accent-soft:#1E2640; --on-ink:#161615; --scrim:rgba(0,0,0,.65); --danger:#F08A7E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#161615; --surface:#212120; --ink:#ECECE8; --muted:#A3A39D; --line:#ECECE8; --soft:#3A3A37; --fill:#2C2C2A;
  --accent:#8EA8F5; --accent-soft:#1E2640; --on-ink:#161615; --scrim:rgba(0,0,0,.65); --danger:#F08A7E; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
*{box-sizing:border-box}
/* stop double-tap-to-zoom on rapid taps (pinch zoom still works for accessibility) */
html,body,*{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.shell{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.shell.wide{max-width:960px}
/* dev-only controls: one compact row above the phone */
.devbar{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;overflow-x:auto}
.devices,.devtools{display:flex;gap:4px}
.devbar button{height:28px;padding:0 9px;border:1px solid var(--muted);background:var(--surface);color:var(--ink);border-radius:6px;font:600 11px var(--sans);cursor:pointer}
.devices button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.devtools button{border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent}
@media (max-width:360px){.devbar button{padding:0 6px}.devices,.devtools{gap:3px}}

.phone{position:relative;border:1.5px solid var(--line);border-radius:22px;background:var(--bg);height:min(780px,calc(100dvh - 76px));min-height:600px;display:flex;flex-direction:column;overflow:hidden}
.wide .phone{height:auto;min-height:560px}
.top{padding:10px 12px 10px 16px;border-bottom:1.5px solid var(--line);background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.lbl{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2{margin:2px 0 0;font:700 22px/1.2 var(--sans);text-wrap:balance}
.scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.center{justify-content:center;align-items:center;text-align:center}
.foot{flex:none;padding:12px 16px 16px;border-top:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
p{margin:0;font:14px/1.45 var(--sans);color:var(--muted)}
.btn,.btn2,.proto button{min-height:54px;width:100%;border-radius:12px;font:600 16px var(--sans);cursor:pointer;border:1.5px solid var(--line);padding:0 16px}
.btn{background:var(--ink);color:var(--on-ink)}
.btn:disabled{background:var(--soft);border-color:var(--soft);color:var(--muted);cursor:not-allowed}
.btn2{background:transparent;color:var(--ink)}
.danger{color:var(--danger);border-color:var(--danger)}
.link{background:none;border:none;color:var(--accent);font:600 14px var(--sans);padding:10px 0;cursor:pointer;text-align:left;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.ph{background:var(--fill);border:1.5px dashed var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 12px var(--mono);letter-spacing:.06em;color:var(--muted)}
.proto{border:1.5px dashed var(--accent);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;width:100%}
.proto .lbl{color:var(--accent)}
.proto button{min-height:44px;border-color:var(--accent);background:var(--surface);color:var(--accent);font-size:14px}
.fld{display:flex;flex-direction:column;gap:6px;text-align:left}
.fld label{font:500 13px var(--sans)}
.opt-tag{font-weight:400;color:var(--muted)}
.fld input,.fld select{height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:16px var(--sans);background:var(--surface);color:var(--ink);width:100%}
.err{color:var(--ink);background:var(--fill);border-radius:8px;padding:10px 12px;font:500 13px var(--sans);text-align:left}
.banner{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font:500 13px var(--sans);display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font:600 24px var(--mono);font-variant-numeric:tabular-nums}
.icon{width:44px;height:44px;flex:none;border-radius:10px;border:none;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon:not(:disabled):hover,.icon:not(:disabled):active{background:var(--fill)}
.top.tight{padding:4px 6px}

/* segmented choice */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{min-height:56px;border:none;background:transparent;color:var(--ink);font:600 15px var(--sans);cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* scoreboard: glance zone */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.side{padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;container-type:inline-size}
button.side{border:none;border-left:1.5px solid var(--line);background:var(--fill);color:var(--ink);font:inherit;cursor:pointer}
.vp{font:600 52px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* big scores shrink with their card so three digits always fit */
.vp{font-size:min(52px,46cqi)}
.meta{font:500 13px var(--sans);color:var(--muted)}
.trk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.trk button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--mono);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums}
.trk button.cur{background:var(--ink);color:var(--on-ink);cursor:default}
.trk button:disabled{border-style:dashed;color:var(--muted);background:transparent;cursor:default}

/* control deck: thumb zone */
.deck{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.deck>.lbl{min-height:20px;display:flex;align-items:flex-end}
.stp{display:flex;align-items:stretch;gap:8px;height:68px}
.lefty .stp{flex-direction:row-reverse}
.stp button{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 26px var(--mono);cursor:pointer;flex:none}
.stp .minus{width:56px}
.stp .plus{width:84px;background:var(--ink);color:var(--on-ink);font-size:30px}
.stp .mid{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.stp .mid>div:first-child{flex:1;line-height:1.15}
.stp .mid .v{font:600 30px var(--mono);font-variant-numeric:tabular-nums;flex:none}
@media (max-width:400px){.stp .minus{width:48px}.stp .plus{width:64px}.stp .mid{padding:0 10px}}
.t-short{display:none}
/* batch strip: bottom of the scoreboard, divided from the score by a light line */
.bstrip{display:flex;align-items:flex-end;gap:12px;padding:6px 10px 8px 16px;border-top:1px solid var(--soft)}
.board:not(.solo) .bstrip{grid-column:1/-1}
.board{grid-template-rows:minmax(0,1fr) auto}   /* spare height goes to the score, never the strip */
.bmeter{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
.bsum{height:26px;font:700 26px/26px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.bsum.neg{color:var(--danger)}
.tbar{height:4px;border-radius:2px;overflow:hidden}
.tbar.on{background:var(--soft)}
.tbar i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:pdrain 3s linear both}
.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg4 button{min-height:44px;font-size:13px}
.pend{margin:-10px 6px -10px auto;padding:10px 6px;min-width:44px;border:0;background:transparent;color:var(--accent);font:700 18px/1 var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}
.pend.neg{color:var(--danger)}
.pbar{height:3px;margin:-4px 2px -2px;border-radius:2px;overflow:hidden}
.pbar.on{background:var(--soft)}
.pbar i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:pdrain 3s linear both}
@keyframes pdrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.vp-pend{color:var(--accent);font-weight:700;letter-spacing:0}
.toastov{position:absolute;left:50%;top:6px;z-index:8;max-width:calc(100% - 32px);padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--on-ink);font:600 14px var(--sans);
  box-shadow:0 8px 24px rgba(0,0,0,.28);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:toastov 4s ease both}
@keyframes toastov{0%{opacity:0;transform:translate(-50%,-8px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){@keyframes toastov{0%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}}
body:not(.dev) .devbar,body:not(.dev) .devbtn{display:none!important}
body:not(.dev) .phone{height:min(780px,calc(100dvh - 40px))}
.board.solo{grid-template-columns:1fr}
.board.solo .side.sb{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 16px 14px}
.sb-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.board.solo .vp{font-size:min(64px,20cqi);white-space:nowrap}
.sb-main .lbl,.stat .lbl{white-space:nowrap}
.stats{display:flex;gap:16px;justify-content:flex-end;flex:none}
@media (max-width:350px){.stats{gap:12px}}
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:2ch}
.stat .big{font:700 min(32px,10cqi)/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.readybtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--accent);border-color:var(--accent)}
.readybtn .rb-main{display:flex;align-items:center;gap:6px}
.readybtn .rb-sub{font:500 12px var(--sans);opacity:.85}
.dg{width:min(260px,100%);height:auto;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dg .acc,.dg .acc *{stroke:var(--accent)}
.dg .fill{fill:var(--ink)}
.dg .acc .fill,.dg .acc.fill{fill:var(--accent)}
.dg text{fill:var(--muted);stroke:none;font:600 12px var(--mono)}
.dg text.sm{font-size:10px}
.dg text.big{fill:var(--ink);font-size:14px}.dg text.huge{fill:var(--ink);font-size:24px}
.dg text.dim{fill:var(--muted)}
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:8px;height:8px;border-radius:4px;background:var(--soft)}
.dots span.on{width:22px;background:var(--ink)}
.devbtn{min-height:36px;width:100%;border:1.5px dashed var(--accent);border-radius:10px;background:transparent;color:var(--accent);font:600 13px var(--sans);cursor:pointer}
.cpbar{display:flex;align-items:stretch;gap:6px;height:60px}
.lefty .cpbar{flex-direction:row-reverse}
.cpbar button{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 20px var(--mono);cursor:pointer;padding:0}
.cpbar button.add{background:var(--ink);color:var(--on-ink)}
.cpmid{flex:none;width:72px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cpmid .v{font:600 26px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
/* scoreboard stays pinned while the controls scroll on short phones */
.scroll>.board{position:sticky;top:0;z-index:2;flex:none;box-shadow:0 -10px 0 var(--bg)}
@media (max-height:760px){.vp{font-size:min(40px,40cqi)}.side{padding:8px 12px}.trk button{min-height:44px}.scr-b button{height:46px}.stp{height:60px}.scroll{gap:10px}}
@media (max-width:360px){.scr-b{gap:4px}.scr-b button{font-size:13px}.scr-b button:nth-child(1){margin-right:4px}.lefty .scr-b button:nth-child(1){margin-left:4px}}
@media (max-width:350px){.t-long{display:none}.t-short{display:inline}}
.scr{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.scr-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
.scr-h .v{font:600 30px var(--mono);font-variant-numeric:tabular-nums}
.scr-b{display:flex;gap:6px}
.lefty .scr-b{flex-direction:row-reverse}
.scr-b button{flex:1;min-width:0;height:50px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 16px var(--mono);cursor:pointer;padding:0}
.scr-b button.add{background:var(--ink);color:var(--on-ink)}
.scr-b button:nth-child(1){margin-right:6px}
.lefty .scr-b button:nth-child(1){margin-right:0;margin-left:6px}
.icon:disabled{color:var(--soft);cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;z-index:10}
.sheet{background:var(--surface);border-top:1.5px solid var(--line);border-radius:18px 18px 0 0;padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px;max-height:90%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--soft);align-self:center;margin-bottom:4px}
.sep{height:1px;background:var(--soft);margin:4px 0}
table{width:100%;border-collapse:collapse;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:8px 0;border-bottom:1px solid var(--soft);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vs .card{display:flex;flex-direction:column;gap:6px;min-width:0;container-type:inline-size}
.tag{display:inline-block;border:1.5px solid var(--line);border-radius:6px;padding:2px 6px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.timer{background:var(--ink);color:var(--on-ink);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font:500 14px var(--sans)}
.timer b{font:600 20px var(--mono)}
details{border:1.5px dashed var(--line);border-radius:10px;padding:0 12px}
summary{min-height:46px;display:flex;align-items:center;font:600 14px var(--sans);cursor:pointer}
details p{padding-bottom:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:0 4px;font:600 16px var(--sans)}
.toggle input{width:26px;height:26px;accent-color:var(--ink)}
/* spectator, wide */
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.spec>.card{container-type:inline-size}
.spec .vp{font-size:min(120px,46cqi)}
@media (max-width:560px){.spec{gap:10px}.spec .card{padding:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="devbar" aria-label="Prototype controls">
    <div class="devices" role="group" aria-label="Simulated device">
      <button type="button" data-dev="0" aria-label="Player 1">P1</button>
      <button type="button" data-dev="1" aria-label="Player 2">P2</button>
      <button type="button" data-dev="2">Spectator</button>
    </div>
    <div class="devtools">
      <button type="button" id="skipSetup">Skip to BR1</button>
      <button type="button" id="resetAll">Reset</button>
    </div>
  </div>
  <div class="phone" id="app"></div>
</div>

<script>
const ROOM = 'K7Q-29';
const ARMIES = ['Space Marines','Necrons','Orks','Aeldari','Tyranids','Astra Militarum','Chaos Space Marines',"T'au Empire"];
const DETS = ['[Detachment A]','[Detachment B]','[Detachment C]'];
const DISPS = ['[Disposition A]','[Disposition B]','[Disposition C]'];
const TIMER_MS = 5 * 60 * 1000, TOAST_MS = 4000;
let BATCH_MS = 3000;   // score taps gather into one batch that commits this long after the last tap (CP is instant)
const BATCH_KEY = 'scorehammer:batchMs', BATCH_OPTS = [[0,'Instant'],[3000,'3s'],[5000,'5s'],[10000,'10s']];
try { const v = +localStorage.getItem(BATCH_KEY); if (BATCH_OPTS.some(([ms]) => ms === v) && localStorage.getItem(BATCH_KEY) !== null) BATCH_MS = v; } catch (e) {}
const batchSeg = () => `<div class="fld" style="padding:6px 4px 2px"><span class="lbl">Score delay</span>
  <p style="font-size:12px;margin:0 0 4px">How long Primary and Secondary taps wait before they’re added to your score.</p>
  <div class="seg seg4" role="group" aria-label="Score delay">${BATCH_OPTS.map(([ms, l]) => `<button type="button" data-act="setBatch" data-arg="${ms}" aria-pressed="${BATCH_MS === ms}">${l}</button>`).join('')}</div></div>`;
const LABEL = { prim:'Primary', sec:'Secondary', cp:'Command points', postP:'End-game primary', postS:'End-game secondary' };
const QR = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM21 14v3M14 21h7"/></svg>';
const MENU = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';

const freshPlayer = (name = '') => ({ screen:'start', prev:'round', name, maxRound:1, reachedFS:false, army:'', det1:'', det2:'', det3:'', detCount:1, disp:'',
  confirmed:false, ready:false, round:1, roundDone:false, flash:null, history:[], undone:null, pend:null, prim:[0,0,0,0,0], sec:[0,0,0,0,0], postP:0, postS:0, cp:0, done:false,
  sheet:null, editRound:null, last:null, joinErr:'', code:'', lefty:false });
let G, dev = 0, wake = null;
var newGame = function(){ G = { solo:null, host:null, connected:false, over:false, attacker:null, first:null, restartReq:null, endedAt:null, spectating:false, conceded:null, concedeRound:null, players:[freshPlayer(), freshPlayer()] }; }
const CONCEDE_MS = 5000;
const SAVE_KEY = 'scorehammer:game';
let SEEN = [false, false];   // per device: has this player finished or skipped onboarding?
const _newGame = newGame;
newGame = function(){ _newGame(); };   // onboarding only opens from 'How it works' on the start screen
newGame();

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const total = p => sum(p.prim) + sum(p.sec) + p.postP + p.postS;
const roundPts = (p, r) => p.prim[r] + p.sec[r];
const nm = i => esc(G.players[i].name.trim() || `Player ${i + 1}`);
const dets = p => [p.det1, p.det2, p.det3].map(x => x.trim()).filter(Boolean).join(' + ');
// army details are optional: show only what was entered, else a quiet fallback
const listInfo = (p, compact = false) => {
  const army = p.army.trim(), disp = p.disp.trim();
  const parts = compact ? [army, disp] : [[army, dets(p)].filter(Boolean).join(' · '), disp ? 'Disposition: ' + disp : ''];
  const shown = parts.filter(Boolean).map(esc);
  return shown.length ? shown.join('<br>') : 'No army details added';
};
const remaining = () => G.endedAt ? Math.max(0, TIMER_MS - (Date.now() - G.endedAt)) : TIMER_MS;
const clock = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const signed = n => (n > 0 ? '+' : '') + n;
function status(p){
  if (p.screen === 'setup' && p.ready) return 'Ready';
  if (['onboard','start','host','join','connected','setup'].includes(p.screen)) return 'Setting up army';
  if (p.screen === 'post') return 'End-game scoring';
  if (p.screen === 'results') return 'Finished';
  return p.roundDone ? `Finished BR${p.round}` : `Scoring BR${p.round}`;
}
const opts = (list, val, empty) => `<option value="">${empty}</option>` + list.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('');
const CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
const BACK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
// header: optional back button (an action name), optional eyebrow, title, right-side icons
const bar = (eyebrow, title, right = '', back = '') => `<div class="top"${back ? ' style="padding-left:6px"' : ''}><div style="display:flex;align-items:center;gap:4px;min-width:0">${back ? `<button type="button" class="icon" data-act="${back}" aria-label="Back">${BACK}</button>` : ''}<div style="min-width:0">${eyebrow ? `<div class="lbl">${eyebrow}</div>` : ''}<h2>${title}</h2></div></div>${right}</div>`;
const foot = (...btns) => `<div class="foot">${btns.join('')}</div>`;
const b = (label, act, cls = 'btn', extra = '') => `<button type="button" class="${cls}" data-act="${act}" ${extra}>${label}</button>`;
const sheet = (inner, close = 'closeSheet') => `<div class="overlay" ${close ? `data-act="${close}"` : ''}><div class="sheet" data-stop role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
const UNDO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';
// undo: pass the player to show it; disabled when there is nothing this round to undo
// ---- score batching ----
// P.pend = { where: round number (or 'post' for end-of-game), d: { key: delta }, due: timestamp }
// Taps on Primary/Secondary add to P.pend; 3 s after the last tap the whole batch commits as ONE undo step.
const isRoundKey = k => k === 'prim' || k === 'sec';
const pendItems = P => P.pend ? Object.entries(P.pend.d).filter(([, v]) => v).map(([key, d]) => ({ key, d, r: P.pend.where === 'post' ? null : P.pend.where })) : [];
const describe = e => (e.items || [e]).map(it => `${LABEL[it.key]} ${signed(it.d)}`).join(', ');
function commitPend(P){
  const items = pendItems(P); P.pend = null;
  if (!items.length) return false;
  items.forEach(it => { if (it.r) P[it.key][it.r - 1] = Math.max(0, P[it.key][it.r - 1] + it.d); else P[it.key] = Math.max(0, P[it.key] + it.d); });
  const entry = { items, t:Date.now() };
  P.history.push(entry); if (P.history.length > 50) P.history.shift();
  P.last = { key:items[0].key, d:items[0].d, r:items[0].r, t:entry.t };
  return true;
}
function commitAll(){ let any = false; G.players.forEach(p => { if (p.pend) any = commitPend(p) || any; }); return any; }
const pendFor = (P, key, r) => (P && P.pend && P.pend.where === (isRoundKey(key) ? (r ? +r : P.round) : 'post')) ? (P.pend.d[key] || 0) : 0;
const pendLeft = P => P && P.pend ? Math.max(0, P.pend.due - Date.now()) : 0;
const vpPend = P => { const n = pendItems(P).reduce((a, it) => a + it.d, 0); return n ? ` <b class="vp-pend">${signed(n)}</b>` : ''; };
// one countdown for the whole batch, at the bottom of the scoreboard: running total above the bar, Undo beside it
const bstrip = P => { const n = pendItems(P).reduce((a, it) => a + it.d, 0), left = pendLeft(P);
  return `<div class="bstrip"><div class="bmeter"><div class="bsum${n < 0 ? ' neg' : ''}" aria-live="polite">${n ? signed(n) : ''}</div>
    <div class="tbar${P.pend ? ' on' : ''}" aria-hidden="true">${P.pend ? `<i style="animation-duration:${BATCH_MS}ms;animation-delay:-${BATCH_MS - left}ms"></i>` : ''}</div></div>${undoBtn(P)}</div>`; };
let VIEWP = null;   // the player whose screen is being drawn (scorer reads pending points from it)

const undoBtn = P => { const L = P.pend ? { items:pendItems(P), pending:true } : P.history[P.history.length - 1];
  const lbl = L ? `Undo ${L.pending ? 'pending ' : ''}${describe(L)}` : '';
  return `<button type="button" class="icon" data-act="undo" ${L ? `aria-label="${lbl}" title="${lbl}"` : 'aria-label="Nothing to undo" disabled'}>${UNDO}</button>`; };
const icons = (menu = true) => `<div style="display:flex;gap:2px">${G.solo === null ? `<button type="button" class="icon" data-act="sheet" data-arg="share" aria-label="Invite spectators">${QR}</button>` : ''}${menu ? `<button type="button" class="icon" data-act="sheet" data-arg="menu" aria-label="Menu">${MENU}</button>` : ''}</div>`;
// stepper: − small, + large; key:round lets one control target any round
const stepper = (title, value, sub, key, r = '', short = title) => `<div class="stp">
  <button type="button" class="minus" data-act="bump" data-arg="${key}:-1:${r}" aria-label="Remove one ${title}">−</button>
  <div class="mid"><div style="min-width:0"><div style="font:600 15px var(--sans)"><span class="t-long">${title}</span><span class="t-short">${short}</span></div>${sub ? `<div class="meta" style="font-size:12px">${sub}</div>` : ''}</div><div class="v">${value}</div></div>
  <button type="button" class="plus" data-act="bump" data-arg="${key}:1:${r}" aria-label="Add one ${title}">+</button></div>`;

// round track: past rounds open the fix-a-round sheet; on the post-game screen every round is fixable
// BR1–5 then FS (final scoring). On the final scoring screen FS is current and every BR is fixable
// single mode: the track is navigation. Any round you've reached (and FS once reached) opens that round's normal page
const soloTrack = (P, final) => { const max = P.reachedFS ? 5 : (P.maxRound || P.round);
  return `<div class="trk">${[1,2,3,4,5].map(n => (!final && n === P.round)
    ? `<button type="button" class="cur" aria-current="step">BR${n}</button>`
    : n <= max ? `<button type="button" data-act="goRound" data-arg="${n}" aria-label="Go to battle round ${n}">BR${n}</button>`
    : `<button type="button" disabled>BR${n}</button>`).join('')}${final
    ? '<button type="button" class="cur" aria-current="step" aria-label="Final scoring">FS</button>'
    : P.reachedFS ? '<button type="button" data-act="goRound" data-arg="6" aria-label="Go to final scoring">FS</button>'
    : '<button type="button" disabled aria-label="Final scoring">FS</button>'}</div>`; };
const track = (P, final = false) => G.solo !== null ? soloTrack(P, final) : `<div class="trk">${[1,2,3,4,5].map(n => (n === P.round && !final)
  ? `<button type="button" class="cur" aria-current="step">BR${n}</button>`
  : (n < P.round || final) ? `<button type="button" data-act="editRound" data-arg="${n}" aria-label="Fix battle round ${n}">BR${n}</button>`
  : `<button type="button" disabled>BR${n}</button>`).join('')}${final
  ? '<button type="button" class="cur" aria-current="step" aria-label="Final scoring">FS</button>'
  : '<button type="button" disabled aria-label="Final scoring">FS</button>'}</div>`;

// VP scorer: −10 −5 −1 | +1 +5 +10. Adds are filled so they read as the main action; order mirrors for left-handed use
const scorer = (title, value, sub, key, r = '') => { const pd = pendFor(VIEWP, key, r), left = pendLeft(VIEWP);
  return `<div class="scr">
  <div class="scr-h"><div style="min-width:0"><div style="font:600 15px var(--sans)">${title}</div>${sub ? `<div class="meta" style="font-size:12px">${sub}</div>` : ''}</div>${pd ? `<button type="button" class="pend${pd < 0 ? ' neg' : ''}" data-act="commitNow" aria-label="Add ${signed(pd)} ${title} now">${signed(pd)}</button>` : ''}<div class="v">${value}</div></div>
  <div class="scr-b">${[-1,1,2,3,4,5].map(d => `<button type="button" class="${d > 0 ? 'add' : ''}" data-act="bump" data-arg="${key}:${d}:${r}" aria-label="${d > 0 ? 'Add' : 'Remove'} ${Math.abs(d)} ${title}">${d > 0 ? '+' + d : '−' + Math.abs(d)}</button>`).join('')}</div></div>`; };

// CP footer: −2 −1 [CP] +1 +2 with a narrow centered readout
const cpBar = P => `<div class="cpbar">${[-2,-1].map(d => `<button type="button" data-act="bump" data-arg="cp:${d}:" aria-label="Remove ${-d} CP">−${-d}</button>`).join('')}
  <div class="cpmid" role="status" aria-label="${P.cp} command points"><span class="lbl">CP</span><span class="v">${P.cp}</span></div>
  ${[1,2].map(d => `<button type="button" class="add" data-act="bump" data-arg="cp:${d}:" aria-label="Add ${d} CP">+${d}</button>`).join('')}</div>`;

const PHONE = (x, y, w = 56, h = 100) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/><line x1="${x + w/2 - 8}" y1="${y + 7}" x2="${x + w/2 + 8}" y2="${y + 7}"/>`;
const SLIDES = [
  { title:'Track your score',

      <line x1="86" y1="80" x2="120" y2="80"/>
      <rect x="86" y="88" width="10" height="10" rx="2"/><g class="acc">${[0,1,2,3,4].map(k => `<rect x="${100 + k*11}" y="88" width="9" height="10" rx="2" class="fill"/>`).join('')}</g>
      <line x1="86" y1="108" x2="120" y2="108"/>
      <rect x="86" y="116" width="10" height="10" rx="2"/><g class="acc">${[0,1,2,3,4].map(k => `<rect x="${100 + k*11}" y="116" width="9" height="10" rx="2" class="fill"/>`).join('')}</g>
      <line x1="76" y1="132" x2="164" y2="132"/>
      <text x="40" y="43" text-anchor="middle" class="sm">VP</text><path d="M52 39h30" stroke-dasharray="3 4"/>
      <text x="40" y="110" text-anchor="middle" class="sm">+1–5</text><path d="M60 106h22" stroke-dasharray="3 4"/>
      <text x="204" y="68" text-anchor="middle" class="sm">BR1–5</text><path d="M184 64h-30" stroke-dasharray="3 4"/>
      <text x="200" y="142" text-anchor="middle" class="sm">CP</text><path d="M188 139h-22" stroke-dasharray="3 4"/>` },
];

// single mode: one big personal scoreboard, no opponent
const priTot = P => sum(P.prim) + P.postP, secTot = P => sum(P.sec) + P.postS;
const stat = (label, short, v) => `<div class="stat"><span class="lbl"><span class="t-long">${label}</span><span class="t-short">${short}</span></span><span class="big">${v}</span></div>`;
// readout like PhosphorDice: big VP on the left, label-over-number totals on the right. CP lives only in the footer bar
const soloBoard = P => `<div class="board solo"><div class="side sb"><div class="sb-main"><span class="lbl">Your score</span><span class="vp">${total(P)}</span></div><div class="stats">${stat('Primary', 'Pri', priTot(P))}${stat('Secondary', 'Sec', secTot(P))}</div></div>${bstrip(P)}</div>`;

function playerView(i){
  const P = G.players[i], o = 1 - i, O = G.players[o];
  let h = '';
  VIEWP = P;
  const undone = P.undone ? `<span class="sr" role="status">${P.undone.pending ? 'Cancelled pending' : 'Undid'} ${describe(P.undone)}</span>` : '';
  // toasts float over the screen instead of taking space in the layout; the negative delay keeps the fade in step across re-draws
  const flashAge = P.flash ? Date.now() - P.flash.t : Infinity;
  const toastOv = flashAge < TOAST_MS ? `<div class="toastov" role="status" style="animation-delay:-${flashAge}ms">${esc(P.flash.text)}</div>` : '';
  const flash = '';
  switch (P.screen){
    case 'onboard': {
      const k = P.obStep || 0, S = SLIDES[k], last = k === SLIDES.length - 1;
      h = `${SLIDES.length > 1 ? `<div class="top tight" style="justify-content:flex-end">${b('Skip','obDone','link','style="padding:0 12px;min-height:44px"')}</div>` : ''}

          ${SLIDES.length < 2 ? '' : `<div class="dots" aria-label="Step ${k + 1} of ${SLIDES.length}">${SLIDES.map((_, n) => `<span class="${n === k ? 'on' : ''}"></span>`).join('')}</div>`}</div>`
        + foot(`<div style="display:flex;gap:8px">${k ? b('Back','obBack','btn2','style="flex:1"') : ''}${b(last ? 'Get started' : 'Next', last ? 'obDone' : 'obNext','btn','style="flex:2"')}</div>`);
      break; }
    case 'start':
      h = `<div class="scroll center"><div class="ph" style="width:88px;height:88px;border-radius:20px">LOGO</div><h1 style="font-size:30px">ScoreHammer</h1><p>Track your 40K score round by round.</p>${b('How it works','obReplay','link','style="text-align:center"')}</div>`
        + foot(b('Single mode','solo'), ...(document.body.classList.contains('dev') ? [b('Host a game','host','btn2'), b('Join a game','join','btn2')] : []))   // two-player mode is dev-only for now;
      break;
    case 'host':
      h = bar('','Have your opponent scan')
        + `<div class="scroll center"><div class="ph" style="width:min(240px,70%);aspect-ratio:1;max-width:100%">QR CODE</div><div><div class="lbl">Room code</div><div class="num" style="letter-spacing:.12em;font-size:30px">${ROOM}</div></div>
           <div class="banner" style="width:100%"><span>Waiting for opponent…</span></div>
           <div class="proto"><div class="lbl">Prototype</div><p>Switch to Player ${o + 1} and tap Join a game.</p></div></div>`
        + foot(b('Cancel','cancelHost','btn2'));
      break;
    case 'join':
      h = bar('','Scan the host’s code')
        + `<div class="scroll"><div class="ph" style="flex:1;min-height:180px">CAMERA VIEWFINDER</div>
           <div class="proto"><div class="lbl">Prototype</div><button type="button" data-act="scan">Simulate scanning the QR</button></div>
           <div class="fld"><label for="code${i}">Can’t scan? Enter the room code</label><input id="code${i}" data-field="code" value="${esc(P.code)}" placeholder="e.g. ${ROOM}" autocomplete="off" autocapitalize="characters"></div>
           ${P.joinErr ? `<div class="err" role="alert">${P.joinErr}</div>` : ''}</div>`
        + foot(b('Join with code','doJoin'), b('Cancel','go','btn2','data-arg="start"'));
      break;
    case 'connected':
      h = `<div class="scroll center"><div style="width:76px;height:76px;border-radius:38px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></div>
           <h2>Connected</h2><p>You’re linked with Player ${o + 1}’s device.</p></div>` + foot(b('Set up my army','go','btn','data-arg="setup"'));
      break;
    case 'setup': {
      const ok = !!P.name.trim();
      h = bar('','Your army', icons())
        + `<div class="scroll">
           <div class="fld"><label for="name${i}">Player name</label><input id="name${i}" data-field="name" value="${esc(P.name)}" placeholder="Your name" autocomplete="off"></div>
           <div class="fld"><label for="army${i}">Army <span class="opt-tag">optional</span></label><input id="army${i}" data-field="army" value="${esc(P.army)}" placeholder="e.g. Space Marines" autocomplete="off"></div>
           <div class="fld"><label for="d1${i}">Detachment <span class="opt-tag">optional</span></label><input id="d1${i}" data-field="det1" value="${esc(P.det1)}" placeholder="Detachment name" autocomplete="off"></div>
           ${P.detCount > 1 ? `<div class="fld"><label for="d2${i}">Second detachment <span class="opt-tag">optional</span></label><input id="d2${i}" data-field="det2" value="${esc(P.det2)}" placeholder="Detachment name" autocomplete="off"></div>` : ''}
           ${P.detCount > 2 ? `<div class="fld"><label for="d3${i}">Third detachment <span class="opt-tag">optional</span></label><input id="d3${i}" data-field="det3" value="${esc(P.det3)}" placeholder="Detachment name" autocomplete="off"></div>` : ''}
           ${P.detCount < 3 ? `<button type="button" class="link" data-act="addDet">+ Add another detachment</button>` : ''}
           <div class="fld"><label for="disp${i}">Disposition <span class="opt-tag">optional</span></label><input id="disp${i}" data-field="disp" value="${esc(P.disp)}" placeholder="Disposition name" autocomplete="off"></div></div>`

        + foot(`<div class="meta">${nm(o)}: ${O.ready ? 'ready' : 'still setting up their army'}</div>`,
            P.ready ? `<button type="button" class="btn readybtn" data-act="unready" aria-pressed="true"><span class="rb-main">${CHECK} Ready — waiting for ${nm(o)}</span><span class="rb-sub">Tap to undo</span></button>`
                    : b('Ready','ready','btn',`id="setupNext" aria-pressed="false" ${ok ? '' : 'disabled'}`));
      break; }
    case 'round': {
      const r = P.round - 1, waiting = P.roundDone, nextLbl = P.round < 5 ? `BR${P.round + 1}` : 'end-of-game scoring';
      const solo = G.solo !== null;
      const slot = flash
        || (!solo && !waiting && O.roundDone ? `<div class="banner" role="status"><span>${nm(o)} is ready. Tap End battle round ${P.round} to start ${nextLbl}.</span></div>` : '');
      // header holds actions only; the round track below is the visible round indicator
      h = undone + `<div class="top tight" style="justify-content:flex-end"><h2 class="sr">Battle round ${P.round} of 5</h2>${icons()}</div>`
        + `<div class="scroll">
           ${track(P)}

             <div class="side"><span class="lbl">You</span><span class="vp">${total(P)}</span><span class="meta">CP ${P.cp} · Pri ${priTot(P)} · Sec ${secTot(P)}</span></div>

               : waiting

               : b(`End battle round ${P.round}`,'endRound', O.roundDone ? 'btn' : 'btn2','aria-pressed="false"')}
             ${solo ? '' : b(P.round < 5 ? `Force advance to BR${P.round + 1} (dev)` : 'Force advance to final scoring (dev)','forceAdvance','devbtn')}
           </div></div>`
        // CP lives in the pinned footer: the most-tapped control, always in thumb reach
        + foot(cpBar(P));
      break; }
    case 'post':
      h = undone + `<div class="top tight"><div style="display:flex;align-items:center;gap:4px;min-width:0;flex:1;padding-left:10px"><h2 style="font-size:clamp(16px,5vw,20px);white-space:nowrap;margin:0">Final scoring</h2></div>${icons()}</div>`
        + `<div class="scroll">
           ${track(P, true)}
           ${G.solo !== null ? soloBoard(P) : `<div class="board"><div class="side"><span class="lbl">You</span><span class="vp">${total(P)}</span><span class="meta">CP ${P.cp} · Pri ${priTot(P)} · Sec ${secTot(P)}</span></div>
             <button type="button" class="side" data-act="sheet" data-arg="opp" aria-label="Opponent details"><span class="lbl">${nm(o)} ›</span><span class="vp" style="color:var(--muted)">${total(O)}</span><span class="meta">CP ${O.cp}</span></button>${bstrip(P)}</div>`}
           <p>Add points scored at the end of the battle. Leave at 0 if none.</p>
           <div class="deck">
             ${flash}
             ${scorer('Primary', P.postP, '', 'postP')}
             ${scorer('Secondary', P.postS, '', 'postS')}
           </div></div>`
        + foot(b('Finish game','finish'));
      break;
    case 'results': {
      if (G.solo !== null) {   // single mode: your own breakdown only
        const rows = [1,2,3,4,5].map(n => `<tr><td>BR${n}</td><td>${P.prim[n-1]}</td><td>${P.sec[n-1]}</td><td>${roundPts(P, n-1)}</td></tr>`).join('')
          + `<tr><td>End of game</td><td>${P.postP}</td><td>${P.postS}</td><td>${P.postP + P.postS}</td></tr>`;
        h = `<div class="top" style="justify-content:center;text-align:center"><h2 style="font-size:28px">Final score</h2></div>
           <div class="scroll">
           ${soloBoard(P)}
           <div class="card" style="padding:6px 16px;overflow-x:auto"><table><thead><tr><th>Round</th><th>Pri</th><th>Sec</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div></div>`
          + foot(b('New game','newGame'));
        break;
      }
      const both = O.done, me = total(P), them = total(O);
      const conceded = G.conceded !== null;
      const outcome = conceded ? (G.conceded === i ? 'Defeat' : 'Victory') : !both ? 'Waiting for opponent' : me > them ? 'Victory' : me < them ? 'Defeat' : 'Draw';
      const rows = [1,2,3,4,5].map(n => `<tr><td>BR${n}</td><td>${roundPts(P, n-1)}</td><td>${roundPts(O, n-1)}</td></tr>`).join('')
        + `<tr><td>End of game</td><td>${P.postP + P.postS}</td><td>${O.postP + O.postS}</td></tr><tr><td>CP left</td><td>${P.cp}</td><td>${O.cp}</td></tr>`;
      h = `<div class="top" style="justify-content:center;text-align:center"><h2 style="font-size:28px">${outcome}</h2></div>
           <div class="scroll">
           ${conceded ? `<div class="banner"><span>${G.conceded === i ? 'You' : nm(o)} conceded during battle round ${G.concedeRound}.</span></div>`
             : !both ? `<div class="banner"><span>Player ${o + 1} is still scoring. Their total updates live.</span></div>` : ''}
           <div class="vs" style="text-align:center">
             <div class="card"><div class="lbl">${nm(i)}</div><div class="vp">${me}</div><p style="font-size:12px">${listInfo(P, true)}</p></div>
             <div class="card"><div class="lbl">${nm(o)}</div><div class="vp" style="color:var(--muted)">${them}</div><p style="font-size:12px">${listInfo(O, true)}</p></div></div>
           <div class="card" style="padding:6px 16px"><table><thead><tr><th>Round</th><th>You</th><th>Opp</th></tr></thead><tbody>${rows}</tbody></table></div>
           ${G.endedAt ? `<p style="text-align:center;font-size:12px">Spectator view closes in ${clock(remaining())}</p>` : ''}</div>`
        + foot(b('New game','newGame'));
      break; }
    case 'restartWait':
      h = `<div class="scroll" style="justify-content:center"><h2>Waiting for Player ${o + 1} to agree to a restart</h2>
           <p>Both players must agree. Scores and setup will be cleared.</p><div class="proto"><div class="lbl">Prototype</div><p>Switch to Player ${o + 1} to answer.</p></div></div>` + foot(b('Cancel request','cancelRestart','btn2'));
      break;
    case 'declined':
      h = `<div class="scroll" style="justify-content:center"><h2>Your opponent declined the restart</h2>
           <p>Continue the match, or leave. Leaving ends the session for both players.</p></div>` + foot(b('Leave match','confirmLeave','btn2 danger'), b('Continue match','back'));
      break;
    case 'expired':
      h = `<div class="scroll center"><div class="ph" style="width:68px;height:68px;border-radius:34px">END</div><h2>Session ended</h2><p>This match is no longer active.</p></div>` + foot(b('Start a new game','newGame'));
      break;
  }

  // sheets: everything secondary slides up from the bottom, so it opens and closes in the thumb zone
  const r = P.round - 1;
  switch (P.sheet){
    case 'menu': h += G.solo !== null ? sheet(`<div class="lbl">Menu</div>
        <label class="toggle" for="lefty${i}">Left-handed controls<input type="checkbox" id="lefty${i}" data-field="lefty" ${P.lefty ? 'checked' : ''}></label>
        ${batchSeg()}
        <div class="sep"></div>
        ${b('Start over…','sheet','btn2','data-arg="soloRestart"')}
        ${b('Exit to start…','sheet','btn2 danger','data-arg="soloExit"')}
        <div class="sep"></div>${b('Close','closeSheet')}`) : sheet(`<div class="lbl">Menu</div>
        ${b('Invite spectators','sheet','btn2','data-arg="share"')}
        <label class="toggle" for="lefty${i}">Left-handed controls<input type="checkbox" id="lefty${i}" data-field="lefty" ${P.lefty ? 'checked' : ''}></label>
        ${batchSeg()}
        <div class="sep"></div>
        ${b('Restart match…','restart','btn2')}
        ${P.screen === 'round' ? b('Concede…','sheet','btn2 danger','data-arg="concede"') : ''}
        ${b('Leave match…','sheet','btn2 danger','data-arg="leave"')}
        <div class="sep"></div>${b('Close','closeSheet')}`); break;
    case 'share': h += sheet(`<div class="lbl">Invite spectators</div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
        <div class="ph" style="width:180px;height:180px">QR CODE</div><div><div class="lbl">Room code</div><div class="num" style="letter-spacing:.12em">${ROOM}</div></div>
        <p>Or open [short link] on a TV, tablet or phone. Spectators can’t change scores.</p></div>${b('Done','closeSheet')}`); break;
    case 'leave': h += sheet(`<h2>Leave this game?</h2><p>The session ends for both players and any spectators. Scores won’t be saved.</p>
        ${b('Leave match','confirmLeave','btn2 danger')}${b('Keep playing','closeSheet')}`); break;
    case 'opp': h += sheet(`<h2>${nm(o)}</h2><div class="meta">${status(O)}</div>
        <p>${listInfo(O)}</p>
        <table><thead><tr><th>Round</th><th>Primary</th><th>Secondary</th></tr></thead><tbody>
        ${[1,2,3,4,5].map(n => `<tr><td>BR${n}</td><td>${O.prim[n-1]}</td><td>${O.sec[n-1]}</td></tr>`).join('')}
        <tr><td>Total VP</td><td colspan="2">${total(O)}</td></tr><tr><td>CP</td><td colspan="2">${O.cp}</td></tr></tbody></table>${b('Close','closeSheet')}`); break;
    case 'soloRestart': h += sheet(`<h2>Start over?</h2><p>All scores and CP are cleared and you go back to battle round 1.</p>
        ${b('Start over','soloRestart','btn2 danger')}${b('Keep scoring','closeSheet')}`); break;
    case 'soloExit': h += sheet(`<h2>Exit to the start screen?</h2><p>This game’s scores won’t be saved.</p>
        ${b('Exit','newGame','btn2 danger')}${b('Keep scoring','closeSheet')}`); break;
    case 'concede': {
      const left = Math.ceil((CONCEDE_MS - (Date.now() - P.concedeAt)) / 1000);
      h += sheet(`<h2>Are you sure you want to concede?</h2>
        <p>The game ends now for both players and ${nm(o)} wins. This can’t be undone.</p>
        ${b('Cancel','closeSheet','btn2')}${b(left > 0 ? `Yes, concede (${left})` : 'Yes, concede','concede','btn', left > 0 ? 'disabled aria-live="polite"' : '')}`); break; }
    case 'edit': {
      const e = P.editRound - 1;
      h += sheet(`<h2>Fix battle round ${P.editRound}</h2>
        <div class="deck" style="margin-top:0">${scorer('Primary', P.prim[e], '', 'prim', P.editRound)}${scorer('Secondary', P.sec[e], '', 'sec', P.editRound)}</div>
        ${G.solo === null ? '<p style="font-size:13px">Changes sync to your opponent straight away.</p>' : ''}${b('Done','closeSheet')}`); break; }
  }
  if (['round','post'].includes(P.screen)) h += toastOv;
  if (G.restartReq === o && P.screen !== 'expired')
    h += sheet(`<h2>${nm(o)} wants to restart the match</h2><p>All scores and setup will be cleared for both players.</p>${b('Decline','decline','btn2')}${b('Agree and restart','agree')}`, null);
  return h;
}

    <p>Player ${G.solo + 1} is tracking their own score in single mode, so there’s no live game to ${dev === 2 ? 'follow' : 'join'}.</p>
    <div class="proto" style="max-width:360px"><div class="lbl">Prototype</div><p>Use Reset to start a two-player game.</p></div></div>`;
}

function spectatorView(){

  return (G.endedAt ? `<div class="timer"><span>Game over · this view closes in</span><b>${clock(remaining())}</b></div>` : '')
    + `<div class="top"><div><div class="lbl">Spectating · read-only</div><h2>${G.conceded !== null ? `${nm(G.conceded)} conceded` : !['post','results'].includes(P[0].screen) ? `Battle round ${br} of 5` : P[0].done && P[1].done ? 'Final score' : 'End-of-game scoring'}</h2></div><div style="display:flex;align-items:center;gap:10px"><div style="text-align:right"><div class="lbl">Join</div><div class="num" style="font-size:16px">${ROOM}</div></div><div class="ph" style="width:52px;height:52px">QR</div></div></div>
       <div class="scroll"><div class="spec">${col(0)}${col(1)}</div>

       ${G.endedAt ? `<div class="proto" style="max-width:360px"><div class="lbl">Prototype</div><button type="button" data-act="skipTimer">Skip the 5:00 timer</button></div>` : ''}</div>`;

const app = document.getElementById('app'), shell = document.getElementById('shell');
const DEV = location.hash === '#dev';   // add #dev to the URL to show the prototype controls
document.body.classList.toggle('dev', DEV);
let lastView = '';
function render(){
  document.querySelectorAll('[data-dev]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.dev === dev)));
  shell.classList.toggle('wide', dev === 2);
  const P = G.players[dev];
  app.classList.toggle('lefty', !!(P && P.lefty));
  // keep scroll position and focus when re-drawing the same screen, so taps never jump the view
  const view = dev + ':' + (dev === 2 ? 'spec' : P.screen + ':' + (P.sheet || ''));
  const same = view === lastView;
  const scrollTop = same ? (app.querySelector('.scroll') || {}).scrollTop : 0;
  const sheetTop = same ? (app.querySelector('.sheet') || {}).scrollTop : 0;
  const pageY = window.scrollY;
  const f = document.activeElement && app.contains(document.activeElement) ? document.activeElement : null;
  const focusSel = same && f && f.dataset.act ? `[data-act="${f.dataset.act}"]${f.dataset.arg ? `[data-arg="${f.dataset.arg}"]` : ''}` : (same && f && f.id ? '#' + f.id : null);
  const soloOther = G.solo !== null && dev !== G.solo;
  app.innerHTML = soloOther ? soloElsewhere() : dev === 2 ? spectatorView() : playerView(dev);
  if (same) {
    const sc = app.querySelector('.scroll'); if (sc && scrollTop) sc.scrollTop = scrollTop;
    const sh = app.querySelector('.sheet'); if (sh && sheetTop) sh.scrollTop = sheetTop;
    if (window.scrollY !== pageY) window.scrollTo(0, pageY);
    if (focusSel) { const el = app.querySelector(focusSel); if (el && !el.disabled) el.focus({ preventScroll:true }); }
  }
  lastView = view;
  save();   // every tap ends in a render, so every change is saved
  if (P && P.screen === 'round' && !wake && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; w.addEventListener('release', () => { wake = null; }); }).catch(() => {});
}

function act(a, arg){
  const i = dev, o = 1 - i, P = G.players[i], O = G.players[o];
  // anything that leaves the round (or ends the game) commits pending points to the round they were tapped in
  if (['goRound','endRound','forceAdvance','finish','editRound','concede','restart','commitNow'].includes(a) || (a === 'closeSheet' && P.sheet === 'edit')) commitAll();
  const both = s => G.players.forEach(p => { p.screen = s; p.sheet = null; });
  switch (a){
    case 'go': P.screen = arg; P.sheet = null; break;
    case 'obNext': P.obStep = Math.min(SLIDES.length - 1, (P.obStep || 0) + 1); break;
    case 'obBack': P.obStep = Math.max(0, (P.obStep || 0) - 1); break;
    case 'obDone': SEEN[i] = true; P.obStep = 0; P.screen = 'start'; break;
    case 'obReplay': P.obStep = 0; P.screen = 'onboard'; break;
    case 'sheet':
      P.sheet = arg;
      if (arg === 'concede') {   // 5-second hold before Yes unlocks; re-draw each tick while the sheet is open
        const at = P.concedeAt = Date.now();
        const tick = setInterval(() => {
          const open = G.players[i] === P && P.sheet === 'concede' && P.concedeAt === at;
          if (open && dev === i) render();
          if (!open || Date.now() - at >= CONCEDE_MS) clearInterval(tick);
        }, 250);
      }
      break;
    case 'concede':
      if (Date.now() - P.concedeAt < CONCEDE_MS) break;
      Object.assign(G, { conceded:i, concedeRound:P.round, restartReq:null, endedAt:Date.now() });
      G.players.forEach(p => { p.done = true; p.roundDone = false; p.sheet = null; p.screen = 'results'; });
      break;
    case 'closeSheet': P.sheet = null; P.editRound = null; break;
    case 'host': G.host = i; P.screen = 'host'; break;
    case 'cancelHost': G.host = null; P.screen = 'start'; break;
    case 'join': P.screen = 'join'; P.joinErr = ''; break;
    case 'doJoin': {
      const code = P.code.replace(/[^a-z0-9]/gi, '').toUpperCase();
      if (G.host === null || G.host === i) { P.joinErr = 'No game is open with that code. Ask your opponent to tap Host a game first.'; break; }
      if (code !== ROOM.replace('-', '')) { P.joinErr = `That code doesn’t match an open room. Check the code on Player ${o + 1}’s screen.`; break; }
      G.connected = true; both('connected'); break; }
    case 'scan':
      if (G.host === null || G.host === i) { P.joinErr = 'No game is open yet. Switch to the other player and tap Host a game first.'; break; }
      G.connected = true; both('connected'); break;
    case 'addDet': P.detCount = Math.min(3, P.detCount + 1); break;
    case 'ready': if (!P.name.trim()) break; P.ready = true; if (O.ready) both('round'); break;
    case 'unready': P.ready = false; break;
    case 'editRound': P.editRound = +arg; P.sheet = 'edit'; break;
    case 'commitNow': break;   // committed above
    case 'setBatch':   // pending points are added now, then the new delay applies to the next taps
      commitAll(); BATCH_MS = +arg; try { localStorage.setItem(BATCH_KEY, String(BATCH_MS)); } catch (e) {} break;
    case 'bump': {
      const [k, ds, rs] = arg.split(':'); const d = +ds; const r = rs ? +rs : P.round;
      if (k !== 'cp') {   // Primary / Secondary: gather into the pending batch
        const where = isRoundKey(k) ? r : 'post';
        if (P.pend && P.pend.where !== where) commitPend(P);   // a different round starts a new batch
        if (!P.pend) P.pend = { where, d:{}, due:0 };
        const base = isRoundKey(k) ? P[k][r - 1] : P[k], cur = P.pend.d[k] || 0;
        const next = Math.max(-base, cur + d);   // never below zero once committed
        if (next === cur) break;
        P.pend.d[k] = next; P.pend.due = Date.now() + BATCH_MS; P.undone = null;
        if (!pendItems(P).length) P.pend = null;   // e.g. +1 then -1: nothing pending
        if (P.pend && BATCH_MS <= 0) commitPend(P);
        break;
      }
      let applied;   // the change actually made, after clamping at 0, so Undo reverses exactly that
      if (Array.isArray(P[k])) { const before = P[k][r - 1]; P[k][r - 1] = Math.max(0, before + d); applied = P[k][r - 1] - before; }
      else { const before = P[k]; P[k] = Math.max(0, before + d); applied = P[k] - before; }
      if (!applied) break;
      P.last = { key:k, d:applied, r: Array.isArray(P[k]) ? r : null, t:Date.now() };
      P.history.push(P.last); if (P.history.length > 50) P.history.shift(); P.undone = null; break; }
    case 'undo': {   // pending points first; otherwise the last committed batch (or CP tap)
      if (P.pend) { P.undone = { items:pendItems(P), pending:true }; P.pend = null; break; }
      const L = P.history.pop(); if (!L) break;
      (L.items || [L]).forEach(it => { if (it.r) P[it.key][it.r - 1] = Math.max(0, P[it.key][it.r - 1] - it.d); else P[it.key] = Math.max(0, P[it.key] - it.d); });
      P.undone = L; P.last = null; break; }
    case 'forceAdvance': O.roundDone = true;   // dev shortcut: mark the opponent ready, then end this player's round
    // falls through
    case 'goRound':   // single mode: jump to any reached round's page, or FS
      P.sheet = null; P.flash = null;
      if (+arg === 6) P.screen = 'post'; else { P.screen = 'round'; P.round = +arg; }
      break;
    case 'solo':   // single mode: no name, no connection; straight to battle round 1
      newGame(); G.solo = i;
      Object.assign(G.players[i], { screen:'round', name:'You', lefty:P.lefty }); break;
    case 'soloRestart': { const p = G.players[i]; Object.assign(p, freshPlayer('You'), { screen:'round', lefty:p.lefty }); break; }
    case 'endRound':
      if (G.solo !== null) {   // nobody to wait for: Next round moves straight on (undo history is per round, so it carries over)
        P.sheet = null;
        if (P.round < 5) {
          const isNew = P.round + 1 > (P.maxRound || 1);
          P.round++; P.maxRound = Math.max(P.maxRound || 1, P.round);
          P.flash = isNew ? { text:`Battle round ${P.round} has started`, t:Date.now() } : null;
        } else { P.screen = 'post'; P.reachedFS = true; P.flash = null; }
        setTimeout(render, TOAST_MS + 50); break;
      }
      P.sheet = null; P.last = null; P.roundDone = true;
      if (O.roundDone) G.players.forEach(p => {   // both done: advance together
        p.roundDone = false; p.last = null; p.history = []; p.undone = null; if (p.sheet === 'endRound') p.sheet = null;
        if (p.round < 5) { p.round++; p.flash = { text:`Battle round ${p.round} has started`, t:Date.now() }; }
        else { p.screen = 'post'; p.flash = { text:'Both players finished BR5', t:Date.now() }; }
      });
      setTimeout(render, TOAST_MS + 50); break;
    case 'unendRound': P.roundDone = false; break;
    case 'finish': P.done = true; P.screen = 'results'; P.last = null; if (O.done && G.solo === null) G.endedAt = Date.now(); break;
    case 'restart': P.sheet = null; P.prev = P.screen; G.restartReq = i; P.screen = 'restartWait'; break;
    case 'cancelRestart': G.restartReq = null; P.screen = P.prev; break;
    case 'agree': {
      const names = G.players.map(p => p.name), lefty = G.players.map(p => p.lefty);
      G.players = names.map((n, k) => Object.assign(freshPlayer(n), { screen:'setup', lefty:lefty[k] }));
      Object.assign(G, { attacker:null, first:null, restartReq:null, endedAt:null, conceded:null, concedeRound:null }); break; }
    case 'decline': { const r = G.restartReq; G.restartReq = null; G.players[r].screen = 'declined'; break; }
    case 'back': P.screen = P.prev || 'round'; break;
    case 'confirmLeave': G.over = true; G.restartReq = null; G.players.forEach(p => { p.screen = 'expired'; p.sheet = null; }); break;
    case 'newGame': newGame(); break;
    case 'spectate': G.spectating = true; break;
    case 'skipTimer': G.endedAt -= TIMER_MS; break;
  }
  render();
}

let swipeX = null;
app.addEventListener('touchstart', e => { swipeX = e.target.closest('.ob') ? e.touches[0].clientX : null; }, { passive:true });
app.addEventListener('touchend', e => {
  if (swipeX === null) return; const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 50) act(dx < 0 ? 'obNext' : 'obBack');
});
app.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  const stop = e.target.closest('[data-stop]');
  if (stop && (!btn || !stop.contains(btn))) return;
  if (!btn || btn.disabled) return;
  act(btn.dataset.act, btn.dataset.arg);
});
app.addEventListener('input', e => {
  const f = e.target.dataset.field; if (!f || dev === 2) return;
  const P = G.players[dev];
  if (e.target.type === 'checkbox') { P[f] = e.target.checked; render(); return; }
  P[f] = e.target.value;
  if (e.target.tagName === 'SELECT') { render(); return; }
  if (f === 'name' && P.ready && !P.name.trim()) { P.ready = false; render(); return; }   // a name is required to stay ready
  const next = document.getElementById('setupNext');
  if (next) next.disabled = !P.name.trim();
});
document.querySelectorAll('[data-dev]').forEach(x => x.addEventListener('click', () => { dev = +x.dataset.dev; render(); }));
document.getElementById('resetAll').addEventListener('click', () => { SEEN = [false, false]; newGame(); dev = 0; render(); });
// dev shortcut: connected room, both players set up, both on BR1
document.getElementById('skipSetup').addEventListener('click', () => {
  newGame();
  Object.assign(G, { host:0, connected:true });
  [['Player 1','Space Marines'], ['Player 2','Necrons']].forEach(([name, army], k) => Object.assign(G.players[k], {
    name, army, det1:DETS[0], disp:DISPS[0], confirmed:true, ready:true, screen:'round' }));
  G.spectating = true;
  render();
});
setInterval(() => {
  const now = Date.now(); let due = false;
  G.players.forEach(p => { if (p.pend && now >= p.pend.due) due = commitPend(p) || due; });
  if (due) render();
}, 150);
setInterval(() => {
  if (!G.endedAt) return;
  if (dev === 2 || G.players[dev]?.screen === 'results') render();
}, 1000);
// ---- Save and resume (single mode) ----
// The game is written to this browser's storage after every change. On launch, a game in
// progress is restored silently: the player lands back on their round with no prompt.
// Starting a new game or exiting to the start screen clears it.
function save(){
  try {
    if (G.solo !== null) localStorage.setItem(SAVE_KEY, JSON.stringify({ v:1, savedAt:Date.now(), G }));
    else localStorage.removeItem(SAVE_KEY);
  } catch (e) {}   // private browsing or storage full: keep playing, just without saving
}
function restore(){
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!s || s.v !== 1 || !s.G || s.G.solo === null || s.G.solo === undefined) return;
    const p = s.G.players && s.G.players[s.G.solo];
    if (!p || !['round','post','results'].includes(p.screen)) return;
    G = s.G; dev = G.solo;
    G.players.forEach(x => { if (x.pend) commitPend(x); });   // points pending when the app closed are kept
    G.players.forEach(x => { x.sheet = null; x.editRound = null; x.flash = null; x.undone = null; });   // reopen on a clean screen
  } catch (e) {}   // unreadable save: start fresh
}
// also save when the app is backgrounded (switching to the Warhammer app, locking the phone)
addEventListener('pagehide', () => { commitAll(); save(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (commitAll()) render(); save(); } });

restore();
render();
</script>
</body>
</html>
